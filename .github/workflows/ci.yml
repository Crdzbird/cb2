name: CI

on:
  push:
    branches: [main]
  pull_request:

# Two runners, the same matrix on both: a release build with the hybrid
# v5.public, tests, the self-checking example and the v4 cross-check, the
# tests under ASan and UBSan, and a build without liboqs. macOS also runs
# the three libFuzzer targets time-boxed; it mirrors the known-good local
# build with Homebrew dependencies. Linux takes libsodium and libcrypto
# from Ubuntu and builds BLAKE3 and liboqs from pinned sources.
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install deps (LLVM clang for libFuzzer)
        run: brew install cmake ninja libsodium liboqs blake3 openssl@3 llvm lld
      - name: Release build with v5.public, tests, the example and the v4 cross-check
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPASETO5_BUILD_BENCH=OFF
          cmake --build build
          ./build/paseto5_tests
          ./build/paseto5_example_text
      - name: Tests under ASan/UBSan
        run: |
          cmake -S . -B build-asan -G Ninja -DPASETO5_SANITIZE=ON -DPASETO5_BUILD_BENCH=OFF
          cmake --build build-asan --target paseto5_tests paseto5_example_text
          ASAN_OPTIONS=detect_leaks=0 ./build-asan/paseto5_tests
          ASAN_OPTIONS=detect_leaks=0 ./build-asan/paseto5_example_text
      - name: Build without liboqs (v5.local only)
        run: |
          cmake -S . -B build-nopq -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPASETO5_PQ=OFF -DPASETO5_BUILD_BENCH=OFF
          cmake --build build-nopq --target paseto5_tests paseto5_example_text
          ./build-nopq/paseto5_tests
          ./build-nopq/paseto5_example_text
      - name: Fuzz targets (time-boxed)
        env:
          CC: /opt/homebrew/opt/llvm/bin/clang
          CXX: /opt/homebrew/opt/llvm/bin/clang++
        run: |
          cmake -S . -B build-fuzz -G Ninja -DPASETO5_FUZZ=ON \
            -DPASETO5_BUILD_TESTS=OFF -DPASETO5_BUILD_BENCH=OFF -DPASETO5_BUILD_EXAMPLES=OFF \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=/opt/homebrew/opt/lld/bin/ld64.lld
          cmake --build build-fuzz
          for fz in fuzz_local fuzz_public fuzz_claims; do
            test -x "build-fuzz/paseto5_$fz"
            "build-fuzz/paseto5_$fz" -max_total_time=60 -print_final_stats=1
          done

  linux:
    runs-on: ubuntu-24.04
    env:
      PKG_CONFIG_PATH: ${{ github.workspace }}/deps/lib/pkgconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install build tools and the packaged dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libsodium-dev libssl-dev
          cmake --version
      - name: Cache the pinned dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ github.workspace }}/deps
          key: linux-deps-${{ hashFiles('scripts/ci/linux_deps.sh') }}
      - name: Build BLAKE3 and liboqs from pinned sources
        run: bash scripts/ci/linux_deps.sh "${{ github.workspace }}/deps"
      - name: Release build with v5.public, tests, the example and the v4 cross-check
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPASETO5_BUILD_BENCH=OFF
          cmake --build build
          ./build/paseto5_tests
          ./build/paseto5_example_text
      - name: Tests under ASan/UBSan
        run: |
          cmake -S . -B build-asan -G Ninja -DPASETO5_SANITIZE=ON -DPASETO5_BUILD_BENCH=OFF
          cmake --build build-asan --target paseto5_tests paseto5_example_text
          ./build-asan/paseto5_tests
          ./build-asan/paseto5_example_text
      - name: Build without liboqs (v5.local only)
        run: |
          cmake -S . -B build-nopq -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPASETO5_PQ=OFF -DPASETO5_BUILD_BENCH=OFF
          cmake --build build-nopq --target paseto5_tests paseto5_example_text
          ./build-nopq/paseto5_tests
          ./build-nopq/paseto5_example_text
