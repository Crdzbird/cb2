name: CI

on:
  push:
    branches: [main, compact-tokens]
  pull_request:

# Two runners, the same matrix on both: a release build with the hybrid
# cb2.public, tests, the self-checking example and the v4 cross-check, the
# tests under ASan and UBSan, and a build without liboqs. macOS also builds
# the Swift XCFramework and the Swift examples, and runs the six libFuzzer
# targets time-boxed; it mirrors the known-good local
# build with Homebrew dependencies. Linux takes libsodium and libcrypto
# from Ubuntu, builds BLAKE3 and liboqs from pinned sources, and runs the
# constant-time probe under Valgrind (tests/ct/ct_probe.cpp). Two more
# jobs cover what the C++ cannot check about itself: the web build, and
# the independent Python implementation run against every vector.
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install deps (LLVM clang for libFuzzer)
        run: brew install cmake ninja libsodium liboqs blake3 openssl@3 llvm lld go
      - name: Release build with cb2.public, tests, the example, the v4 cross-check and the benchmark binary
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCB2_BUILD_BENCH=ON
          cmake --build build
          ./build/cb2_tests
          ./build/cb2_size --check bench/size_expected.txt
          ./build/cb2_size
          ./build/cb2_example_text
          ./build/cb2_playground playground/demo.cb2
          ./build/cb2_playground playground/demo_text.cb2
          ./build/cb2_playground playground/demo_holder_local.cb2
          ./build/cb2_playground playground/demo_public.cb2
          test -x build/cb2_bench
          ./build/bindings/c/cb2_c_test
          ./build/bindings/c/cb2_c_example
      - name: Install the C library and build its example against the install (CMake and pkg-config)
        run: bindings/c/examples/install_check.sh build
      - name: Tests under ASan/UBSan
        run: |
          cmake -S . -B build-asan -G Ninja -DCB2_SANITIZE=ON -DCB2_BUILD_BENCH=OFF
          cmake --build build-asan --target cb2_tests cb2_size cb2_example_text cb2_playground cb2_c_test cb2_c_example
          ASAN_OPTIONS=detect_leaks=0 ./build-asan/cb2_tests
          ASAN_OPTIONS=detect_leaks=0 ./build-asan/cb2_size --check bench/size_expected.txt
          ASAN_OPTIONS=detect_leaks=0 ./build-asan/cb2_example_text
          ASAN_OPTIONS=detect_leaks=0 ./build-asan/cb2_playground playground/demo.cb2
          ASAN_OPTIONS=detect_leaks=0 ./build-asan/cb2_playground playground/demo_text.cb2
          ASAN_OPTIONS=detect_leaks=0 ./build-asan/cb2_playground playground/demo_holder_local.cb2
          ASAN_OPTIONS=detect_leaks=0 ./build-asan/cb2_playground playground/demo_public.cb2
          ASAN_OPTIONS=detect_leaks=0 ./build-asan/bindings/c/cb2_c_test
          ASAN_OPTIONS=detect_leaks=0 ./build-asan/bindings/c/cb2_c_example
      - name: Build without liboqs (cb2.local only)
        run: |
          cmake -S . -B build-nopq -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCB2_PQ=OFF -DCB2_BUILD_BENCH=OFF
          cmake --build build-nopq --target cb2_tests cb2_size cb2_example_text cb2_playground cb2_c_test cb2_c_example
          ./build-nopq/cb2_tests
          ./build-nopq/cb2_size --check bench/size_expected.txt
          ./build-nopq/cb2_example_text
          ./build-nopq/cb2_playground playground/demo.cb2
          ./build-nopq/cb2_playground playground/demo_text.cb2
          ./build-nopq/cb2_playground playground/demo_holder_local.cb2
          ./build-nopq/bindings/c/cb2_c_test
          ./build-nopq/bindings/c/cb2_c_example
      - name: Bridges with a toolchain on this runner (Swift, Node)
        run: |
          (cd bindings/swift && CB2_SWIFT_SYSTEM_LIBRARY=1 swift test -Xlinker -L"$GITHUB_WORKSPACE/build/bindings/c" -Xlinker -rpath -Xlinker "$GITHUB_WORKSPACE/build/bindings/c")
          node --test bindings/js/test/test.mjs
      - name: Go module (vet, staticcheck, race tests with the examples, the example service over HTTP, linking through pkg-config, the benchmark once)
        working-directory: bindings/go
        run: |
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go test -race ./...
          bash examples/smoke.sh
          go -C bench vet ./...
          go -C bench test -bench . -benchtime 1x ./...
          prefix="$(mktemp -d)"
          cmake --install "$GITHUB_WORKSPACE/build" --prefix "$prefix" > /dev/null
          pcdir="$(dirname "$(find "$prefix" -name cb2_c.pc)")"
          PKG_CONFIG_PATH="$pcdir${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" CGO_LDFLAGS="-Wl,-rpath,$(dirname "$pcdir")" \
            go test -tags cb2_pkgconfig ./...
      - name: Python package (wheel with libcb2_c, delocated, tested in a fresh venv)
        run: |
          python3 -m venv "$RUNNER_TEMP/pybuild"
          "$RUNNER_TEMP/pybuild/bin/python" -m pip install -q --upgrade pip build delocate
          "$RUNNER_TEMP/pybuild/bin/python" -m build --wheel --outdir "$RUNNER_TEMP/dist" bindings/python
          "$RUNNER_TEMP/pybuild/bin/delocate-wheel" -w "$RUNNER_TEMP/wheelhouse" "$RUNNER_TEMP"/dist/cb2-*.whl
          CB2_NOPQ_LIBRARY="$GITHUB_WORKSPACE/build-nopq/bindings/c/libcb2_c.dylib" \
            bash bindings/python/scripts/check_wheel.sh "$RUNNER_TEMP"/wheelhouse/cb2-*.whl
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Java and Kotlin bridges (Gradle build with the benchmarks compiled, tests, examples, quick starts)
        run: |
          cd bindings/java
          ./gradlew --no-daemon build
          ./gradlew --no-daemon -q :examples:token-service:run :examples:token-tour:run
          ./gradlew --no-daemon -q :examples:token-service:quickStart :examples:token-tour:quickStart
      - name: Cache the Swift XCFramework dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: bindings/swift/.build-xcframework/prefix
          key: swift-xcframework-deps-${{ hashFiles('bindings/swift/scripts/build-xcframework.sh') }}
      - name: Swift package on the XCFramework, the examples for macOS and the iOS simulator, and the docs
        working-directory: bindings/swift
        run: |
          swift --version
          swift format lint -r --strict Package.swift Sources Tests \
            Examples/Cb2Walkthrough/Package.swift Examples/Cb2Walkthrough/Sources Examples/Cb2App/Cb2App \
            Benchmarks/Package.swift Benchmarks/Sources Benchmarks/Benchmarks
          bash scripts/build-xcframework.sh
          swift test
          (cd Examples/Cb2Walkthrough && swift run cb2-walkthrough)
          xcodebuild docbuild -scheme Cb2 -destination 'generic/platform=macOS' -derivedDataPath .build/docs -quiet
          cd Examples/Cb2App
          xcodebuild -scheme Cb2App -destination 'generic/platform=macOS' -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO -quiet build
          xcodebuild -scheme Cb2App -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Swift benchmarks against jwt-kit and swift-paseto (release build only, not run, newest Xcode)
        working-directory: bindings/swift/Benchmarks
        env:
          BENCHMARK_DISABLE_JEMALLOC: "true"
          CB2_SWIFT_SYSTEM_LIBRARY: "1"
        run: |
          ls -d /Applications/Xcode*.app
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          export DEVELOPER_DIR="$xcode/Contents/Developer"
          swift --version
          swift --version 2>&1 | grep -Eq 'Swift version (6\.([2-9]|[1-9][0-9])|[7-9])' \
            || { echo "jwt-kit 5.7 needs Swift 6.2 or later; none of the installed Xcodes has it"; exit 1; }
          swift build -c release \
            -Xlinker -L"$GITHUB_WORKSPACE/build/bindings/c" -Xlinker -rpath -Xlinker "$GITHUB_WORKSPACE/build/bindings/c"
      - name: Fuzz targets (time-boxed)
        env:
          CC: /opt/homebrew/opt/llvm/bin/clang
          CXX: /opt/homebrew/opt/llvm/bin/clang++
        run: |
          cmake -S . -B build-fuzz -G Ninja -DCB2_FUZZ=ON \
            -DCB2_BUILD_TESTS=OFF -DCB2_BUILD_BENCH=OFF -DCB2_BUILD_EXAMPLES=OFF -DCB2_BUILD_PLAYGROUND=OFF \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=/opt/homebrew/opt/lld/bin/ld64.lld
          cmake --build build-fuzz
          for fz in fuzz_local fuzz_public fuzz_claims fuzz_compact fuzz_seal fuzz_holder fuzz_sha3; do
            test -x "build-fuzz/cb2_$fz"
            "build-fuzz/cb2_$fz" -max_total_time=60 -print_final_stats=1
          done

  linux:
    runs-on: ubuntu-24.04
    env:
      PKG_CONFIG_PATH: ${{ github.workspace }}/deps/lib/pkgconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install build tools and the packaged dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libsodium-dev libssl-dev valgrind
          cmake --version
          valgrind --version
      - name: Cache the pinned dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ github.workspace }}/deps
          key: linux-deps-${{ hashFiles('scripts/ci/linux_deps.sh') }}
      - name: Build BLAKE3 and liboqs from pinned sources
        run: bash scripts/ci/linux_deps.sh "${{ github.workspace }}/deps"
      - name: Release build with cb2.public, tests, the example, the v4 cross-check and the benchmark binary
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCB2_BUILD_BENCH=ON
          cmake --build build
          ./build/cb2_tests
          ./build/cb2_size --check bench/size_expected.txt
          ./build/cb2_size
          ./build/cb2_example_text
          ./build/cb2_playground playground/demo.cb2
          ./build/cb2_playground playground/demo_text.cb2
          ./build/cb2_playground playground/demo_holder_local.cb2
          ./build/cb2_playground playground/demo_public.cb2
          test -x build/cb2_bench
          ./build/bindings/c/cb2_c_test
          ./build/bindings/c/cb2_c_example
      - name: Install the C library and build its example against the install (CMake and pkg-config)
        run: bindings/c/examples/install_check.sh build
      - name: Tests under ASan/UBSan
        run: |
          cmake -S . -B build-asan -G Ninja -DCB2_SANITIZE=ON -DCB2_BUILD_BENCH=OFF
          cmake --build build-asan --target cb2_tests cb2_size cb2_example_text cb2_playground cb2_c_test cb2_c_example
          ./build-asan/cb2_tests
          ./build-asan/cb2_size --check bench/size_expected.txt
          ./build-asan/cb2_example_text
          ./build-asan/cb2_playground playground/demo.cb2
          ./build-asan/cb2_playground playground/demo_text.cb2
          ./build-asan/cb2_playground playground/demo_holder_local.cb2
          ./build-asan/cb2_playground playground/demo_public.cb2
          ./build-asan/bindings/c/cb2_c_test
          ./build-asan/bindings/c/cb2_c_example
      - name: Build without liboqs (cb2.local only)
        run: |
          cmake -S . -B build-nopq -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCB2_PQ=OFF -DCB2_BUILD_BENCH=OFF
          cmake --build build-nopq --target cb2_tests cb2_size cb2_example_text cb2_playground cb2_c_test cb2_c_example
          ./build-nopq/cb2_tests
          ./build-nopq/cb2_size --check bench/size_expected.txt
          ./build-nopq/cb2_example_text
          ./build-nopq/cb2_playground playground/demo.cb2
          ./build-nopq/cb2_playground playground/demo_text.cb2
          ./build-nopq/cb2_playground playground/demo_holder_local.cb2
          ./build-nopq/bindings/c/cb2_c_test
          ./build-nopq/bindings/c/cb2_c_example
      - name: Bridges with a toolchain on this runner (Node)
        run: |
          node --test bindings/js/test/test.mjs
      - name: Go module (vet, staticcheck, race tests with the examples, the example service over HTTP, linking through pkg-config, the benchmark once)
        working-directory: bindings/go
        run: |
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          go test -race ./...
          bash examples/smoke.sh
          go -C bench vet ./...
          go -C bench test -bench . -benchtime 1x ./...
          prefix="$(mktemp -d)"
          cmake --install "$GITHUB_WORKSPACE/build" --prefix "$prefix" > /dev/null
          pcdir="$(dirname "$(find "$prefix" -name cb2_c.pc)")"
          PKG_CONFIG_PATH="$pcdir${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" CGO_LDFLAGS="-Wl,-rpath,$(dirname "$pcdir")" \
            go test -tags cb2_pkgconfig ./...
      - name: Python package (wheel with libcb2_c, auditwheel repair, tested in a fresh venv; ruff, mypy, a benchmark smoke run)
        run: |
          python3 -m venv "$RUNNER_TEMP/pybuild"
          "$RUNNER_TEMP/pybuild/bin/python" -m pip install -q --upgrade pip build auditwheel patchelf
          "$RUNNER_TEMP/pybuild/bin/python" -m build --wheel --outdir "$RUNNER_TEMP/dist" bindings/python
          "$RUNNER_TEMP/pybuild/bin/auditwheel" repair -w "$RUNNER_TEMP/wheelhouse" "$RUNNER_TEMP"/dist/cb2-*.whl
          CB2_NOPQ_LIBRARY="$GITHUB_WORKSPACE/build-nopq/bindings/c/libcb2_c.so" \
            bash bindings/python/scripts/check_wheel.sh "$RUNNER_TEMP"/wheelhouse/cb2-*.whl
          cd bindings/python
          "$RUNNER_TEMP/pybuild/bin/python" -m pip install -q --group lint --group bench "$RUNNER_TEMP"/wheelhouse/cb2-*.whl
          "$RUNNER_TEMP/pybuild/bin/ruff" check .
          "$RUNNER_TEMP/pybuild/bin/ruff" format --check .
          "$RUNNER_TEMP/pybuild/bin/mypy"
          "$RUNNER_TEMP/pybuild/bin/python" bench/bench_tokens.py --debug-single-value --quiet
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Java and Kotlin bridges (Gradle build with the benchmarks compiled, tests, examples, quick starts)
        run: |
          cd bindings/java
          ./gradlew --no-daemon build
          ./gradlew --no-daemon -q :examples:token-service:run :examples:token-tour:run
          ./gradlew --no-daemon -q :examples:token-service:quickStart :examples:token-tour:quickStart
      # Secrets are marked undefined and memcheck must report nothing:
      # verdicts and outgoing token bytes are declassified in the library
      # (detail::declassify), and the one accepted lookup is listed with
      # its reason in tests/ct/ct_probe.supp. The log is kept as an artifact.
      - name: Constant-time probe under Valgrind
        run: |
          cmake -S . -B build-ct -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCB2_CT_PROBE=ON \
            -DCB2_BUILD_TESTS=OFF -DCB2_BUILD_BENCH=OFF -DCB2_BUILD_EXAMPLES=OFF \
            -DCB2_BUILD_PLAYGROUND=OFF -DCB2_BUILD_BINDINGS=OFF
          cmake --build build-ct --target cb2_ct_probe
          valgrind --tool=memcheck --error-exitcode=1 --track-origins=yes \
            --suppressions=tests/ct/ct_probe.supp --log-file=ct_probe.valgrind.log \
            ./build-ct/cb2_ct_probe | tee ct_probe.out || status=$?
          cat ct_probe.valgrind.log
          grep -q 'ran under Valgrind' ct_probe.out
          grep 'ERROR SUMMARY: 0 errors' ct_probe.valgrind.log
          exit "${status:-0}"
      - name: Keep the Valgrind log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ct_probe-valgrind-log
          path: ct_probe.valgrind.log
          if-no-files-found: ignore

  # The Dart package and the Flutter plugin: format, strict analysis, the
  # hundred-line limit on every Dart file, the package tests and its CLI
  # example against the C ABI built here, then the iOS and macOS framework
  # from pinned sources, the example app built for both and its
  # integration test run on macOS.
  dart:
    runs-on: macos-15
    env:
      FLUTTER_VERSION: 3.47.9
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install deps
        run: brew install cmake ninja libsodium liboqs blake3 openssl@3
      - name: Build the C ABI
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCB2_BUILD_BENCH=OFF \
            -DCB2_BUILD_EXAMPLES=OFF -DCB2_BUILD_PLAYGROUND=OFF
          cmake --build build --target cb2_c cb2_c_test
          ./build/bindings/c/cb2_c_test
          echo "CB2_C_LIBRARY=$GITHUB_WORKSPACE/build/bindings/c/libcb2_c.dylib" >> "$GITHUB_ENV"
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Format and the hundred-line limit
        run: |
          flutter --version
          dart format --output=none --set-exit-if-changed bindings/dart bindings/flutter/cb2_flutter
          long=$(find bindings/dart bindings/flutter/cb2_flutter -name '*.dart' -not -path '*/.dart_tool/*' \
            -not -path '*/build/*' -exec awk 'END { if (NR > 100) print FILENAME ": " NR }' {} \;)
          test -z "$long" || { echo "$long"; exit 1; }
      - name: Package cb2
        working-directory: bindings/dart
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
          dart run example/cb2_example.dart
      - name: Benchmark smoke run
        working-directory: bindings/dart/benchmark
        run: |
          dart pub get
          dart analyze --fatal-infos
          mkdir -p build
          dart compile exe bin/cb2_benchmark.dart -o build/cb2_benchmark
          ./build/cb2_benchmark --quick
      - name: Plugin cb2_flutter
        working-directory: bindings/flutter/cb2_flutter
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      - name: Cache the Apple dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: bindings/flutter/cb2_flutter/build/apple-deps
          key: apple-deps-${{ hashFiles('bindings/flutter/cb2_flutter/tool/build_xcframework.sh') }}
      - name: Build cb2_c.xcframework
        run: bash bindings/flutter/cb2_flutter/tool/build_xcframework.sh
      - name: Example app
        working-directory: bindings/flutter/cb2_flutter/example
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
          flutter build ios --simulator --debug
          flutter build macos --debug
          flutter test integration_test/app_test.dart -d macos

  # The second implementation. tools/check_vectors.py was written from
  # docs/PROTOCOL.md alone and must still pass every committed vector with
  # nothing skipped, so a change to the reference that the document does
  # not describe, or a vector the document does not explain, fails here.
  vectors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install the pinned Python primitives
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/pip install blake3==1.0.11 PyNaCl==1.6.2 dilithium-py==1.5.1 kyber-py==1.2.0
      - name: Check every vector against PROTOCOL.md
        run: |
          .venv/bin/python -I tools/check_vectors.py tests/vectors | tee checker.log
          grep -q ', 0 skipped' checker.log

  # The web playground: the same interpreter compiled to WebAssembly with
  # Emscripten against wasm32 builds of the pinned dependencies, then the
  # demo scripts run through it under node. The committed web/dist is
  # what Pages serves; this job proves the sources still build and pass.
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021
        with:
          version: latest
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Cache the wasm32 dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: web/deps/wasm32
          key: wasm-deps-${{ hashFiles('web/build_deps.sh') }}-${{ runner.os }}
      - name: Build the module and run the demos under node
        run: |
          bash web/build.sh
          node web/smoke.cjs
      - name: Build the JavaScript package's core from the C ABI and run its tests on the fresh build
        run: |
          bash bindings/js/build.sh
          node --test bindings/js/test/test.mjs bindings/js/test/package.test.mjs bindings/js/test/cjs.test.cjs

  # The JavaScript package as npm would ship it, on the oldest Node it
  # supports and on the current LTS: the tests, tsc over typed consumers,
  # arethetypeswrong, the packed tarball installed in a scratch project and
  # used from ES modules, CommonJS and TypeScript, the Node example driven
  # with curl, and the browser example pressing its own buttons in
  # headless Chrome.
  js:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ["22.12.0", "24"]
    defaults:
      run:
        working-directory: bindings/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
      - name: Install the dev tools
        run: npm ci
      - name: Tests, type check, arethetypeswrong and the packed tarball
        run: |
          npm test
          npm run typecheck
          npm run attw
          npm run check:pack
      - name: The Node example, its tests and a curl session against it
        working-directory: bindings/js/examples/node
        run: |
          npm ci
          npm test
          bash smoke.sh
      - name: A quick smoke run of the benchmark against jose and PASETO v4
        working-directory: bindings/js/bench
        run: |
          npm ci
          npm run smoke
      - name: The browser example in headless Chrome
        working-directory: bindings/js/examples/browser
        run: |
          npm ci
          PORT=8080 node serve.mjs &
          for _ in $(seq 50); do curl -s -o /dev/null http://localhost:8080/ && break; sleep 0.1; done
          curl -sI http://localhost:8080/node_modules/cb2/dist/cb2_core.wasm | grep -i 'content-type: application/wasm'
          google-chrome --headless=new --no-sandbox --disable-gpu --no-first-run --user-data-dir="$(mktemp -d)" \
            --virtual-time-budget=10000 --dump-dom 'http://localhost:8080/?selftest' > page.html
          grep -o '<body[^>]*>' page.html
          grep -q 'data-selftest="pass"' page.html
