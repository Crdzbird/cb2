[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "cb2"
dynamic = ["version"]
description = "cb2 tokens (cb2.local, cb2.public, kcb2.seal, holder proofs) for Python, over the cb2_c shared library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Crdzbird" }]
keywords = ["token", "post-quantum", "ml-dsa", "xchacha20", "blake3", "paseto"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Crdzbird/cb2"
Source = "https://github.com/Crdzbird/cb2/tree/main/bindings/python"
Issues = "https://github.com/Crdzbird/cb2/issues"

[dependency-groups]
test = ["pytest>=8"]
lint = ["mypy>=1.10", "ruff>=0.6", "pytest>=8"]
bench = ["pyperf>=2.6", "pyjwt[crypto]>=2.10", "pyseto>=1.8"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.20"
build-dir = "build/{wheel_tag}"
wheel.py-api = "py3"
wheel.packages = ["src/cb2"]
install.components = ["cb2_python"]
sdist.exclude = ["build", "dist", ".mypy_cache", ".pytest_cache", ".ruff_cache"]
metadata.version.provider = "scikit_build_core.metadata.regex"
metadata.version.input = "src/cb2/__init__.py"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src", "tests", "examples", "bench"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["test_local", "test_public"]
warn_unreachable = false

[[tool.mypy.overrides]]
module = ["pyperf"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PT", "RET", "RUF", "D", "BLE", "S"]
ignore = ["D105", "D107", "D401", "N818"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "S301", "S603"]
"src/cb2/rules.py" = ["BLE001"]
"examples/*" = ["S310"]
