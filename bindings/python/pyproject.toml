[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cb2"
version = "0.1.0"
description = "Python bridge for cb2 tokens over the cb2_c shared library, ctypes only"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
packages = ["cb2"]
