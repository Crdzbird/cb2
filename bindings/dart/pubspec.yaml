name: cb2
description: >-
  Dart bindings for cb2, the post-quantum successor to PASETO: cb2.local and
  cb2.public tokens, holder proofs and key sealing over the cb2 C ABI, and
  in a browser over its WebAssembly build.
version: 0.3.0
repository: https://github.com/Crdzbird/cb2/tree/main/bindings/dart
issue_tracker: https://github.com/Crdzbird/cb2/issues
publish_to: none
topics:
  - cryptography
  - token
  - post-quantum
  - ffi
  - wasm
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  stream_channel: ^2.1.0
  test: ^1.25.0
  very_good_analysis: ^11.0.0

# A Flutter web app serves the browser engine from these assets, at
# assets/packages/cb2/js/; tool/sync_web_engine.sh copies them from
# bindings/js and checks the copy.
flutter:
  assets:
    - js/src/
    - js/dist/
