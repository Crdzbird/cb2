name: cb2
description: >-
  Dart bindings for cb2, the post-quantum successor to PASETO: cb2.local and
  cb2.public tokens, holder proofs and key sealing over the cb2 C ABI.
version: 0.2.0
repository: https://github.com/Crdzbird/cb2/tree/main/bindings/dart
issue_tracker: https://github.com/Crdzbird/cb2/issues
publish_to: none
topics:
  - cryptography
  - token
  - post-quantum
  - ffi
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.13.0

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  test: ^1.25.0
  very_good_analysis: ^11.0.0
