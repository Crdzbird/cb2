<!doctype html>
<html lang="en">
<head>

  <style>
    :root { color-scheme: light dark; }
    body { margin: 0 auto; max-width: 60rem; padding: 2rem 1rem; font: 15px/1.5 system-ui, sans-serif; }

  </style>

        "paseto": "/node_modules/paseto/index.js",

</html>
