name: cb2_flutter
description: >-
  Flutter plugin for cb2, the post-quantum successor to PASETO: the cb2 C
  library built or bundled for every platform, with the Dart API of
  package cb2.
version: 0.2.0
repository: https://github.com/Crdzbird/cb2/tree/main/bindings/flutter/cb2_flutter
issue_tracker: https://github.com/Crdzbird/cb2/issues
publish_to: none
topics:
  - cryptography
  - token
  - post-quantum
  - ffi

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  cb2:
    path: ../../dart
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
