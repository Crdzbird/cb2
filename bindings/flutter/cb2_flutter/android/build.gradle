group = "dev.cb2.cb2_flutter"
version = "0.3.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:9.1.0")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// The ABIs the native library is built for, comma separated; each needs a
// prefix under CB2_DEPS_ROOT. The default is every ABI Flutter builds for.
def cb2Abis = (System.getenv("CB2_ANDROID_ABIS") ?: "arm64-v8a,armeabi-v7a,x86_64")
    .split(",").collect { it.trim() }.findAll { !it.isEmpty() }

android {
    namespace = "dev.cb2.cb2_flutter"
    compileSdk = 36
    ndkVersion = android.ndkVersion

    externalNativeBuild {
        cmake {
            path = "../src/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
        ndk {
            abiFilters.addAll(cb2Abis)
        }
        externalNativeBuild {
            cmake {
                arguments(
                    "-DCB2_DEPS_ROOT=" + (System.getenv("CB2_DEPS_ROOT") ?: ""),
                    "-DCB2_DEPS_LIBS=" + (System.getenv("CB2_DEPS_LIBS") ?: ""),
                    "-DCB2_PQ=" + (System.getenv("CB2_PQ") ?: "ON"),
                    "-DCB2_OPENSSL_CHACHA=" + (System.getenv("CB2_OPENSSL_CHACHA") ?: "OFF"),
                    "-DANDROID_STL=c++_static"
                )
                cppFlags("-std=c++20")
            }
        }
    }
}
